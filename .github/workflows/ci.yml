name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: aaqib-argo-cd-learning
  ECR_REPOSITORY: 404433473481.dkr.ecr.ap-south-1.amazonaws.com/aaqib-argocd-learning

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AAQIB
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.ACCESS }}
          aws-secret-access-key: ${{ vars.SECRETS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY }}:latest

      - name: Update deployment image
        run: |
          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${ECR_REPOSITORY}:${GITHUB_SHA}|" deployment.yaml

      - name: Commit image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          if git diff --staged --quiet; then
            echo "Image tag already set"
          else
            git commit -m "Update image to ${GITHUB_SHA}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl apply -f deployment.yaml -f service.yaml
          kubectl rollout status deployment/argocd-demo --timeout=180s
