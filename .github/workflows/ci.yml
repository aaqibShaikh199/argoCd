name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Image name
        id: image
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Update deployment image
        run: |
          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${{ steps.image.outputs.name }}:${{ github.sha }}|" deployment.yaml

      - name: Commit image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          if git diff --staged --quiet; then
            echo "Image tag already set"
            exit 0
          fi
          git commit -m "Update image to ${GITHUB_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
